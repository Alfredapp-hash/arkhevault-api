name: safecase-web-ci

on:
  pull_request:
    paths:
      - 'safecase-web/**'
  push:
    branches: [main]
    paths:
      - 'safecase-web/**'

defaults:
  run:
    working-directory: safecase-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: safecase-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
